# Free tier only (public repositories, or the included minutes of a private one). No secrets are used or needed.
name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pin both actions to a commit SHA before relying on this workflow for a launch.
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.7
      - name: Pinned dependencies
        working-directory: contracts
        run: ./install-deps.sh
      - name: Build (deny warnings, lint)
        working-directory: contracts
        run: forge build
      - name: Test (unit, fuzz, invariant)
        working-directory: contracts
        run: forge test

  web:
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.7
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Contracts for ABIs and expected bytecode
        working-directory: contracts
        run: ./install-deps.sh && forge build
      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Generate ABIs and expected code
        working-directory: web
        run: pnpm contracts:gen
      - name: Committed ABIs and expected code match this build
        run: git diff --exit-code -- web/src/generated/contracts.ts web/src/generated/abis.json web/src/generated/expected-code.json
      - name: Lint, types, tests
        working-directory: web
        run: pnpm lint && pnpm typecheck && pnpm test
      - name: Build (not-deployed state)
        working-directory: web
        run: pnpm build
      - name: Banned copy and secrets
        working-directory: web
        run: pnpm copy:check && pnpm secrets:check
